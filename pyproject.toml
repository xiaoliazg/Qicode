# 项目元信息与打包配置。
# 依赖与工具链见 docs/v1/plan.md「技术栈」与「技术决策」。
[project]
name = "qicode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "rich>=13",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6",
]

[project.scripts]
qicode = "qicode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qicode"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
# 文档不参与 lint / format：`docs/` 里的 Python 代码块是说明性的，字段旁那些注释
# 列是手工对齐的，ruff 0.16 起会把它们一起重排、把那点对齐拆掉。
extend-exclude = ["docs"]
